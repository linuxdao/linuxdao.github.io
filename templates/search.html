{% extends "base.html" %}

{% block title %}{{ section.title }} - {{ config.title }}{% endblock title %}

{% block content %}
<main class="container mx-auto px-4 py-8 max-w-4xl">
  <h1 class="text-2xl font-bold mb-4">搜索</h1>
  <div class="relative mb-8">
    <input type="text" id="pageSearchInput" placeholder="输入关键词，回车搜索..."
           class="w-full bg-white rounded-lg pl-10 pr-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary">
    <i class="fa fa-search absolute left-3 top-4 text-muted"></i>
  </div>

  <div id="searchResults" class="space-y-4">
    <p class="text-muted text-sm" id="searchHint">输入关键词后回车即可搜索全站文章。</p>
  </div>
</main>

<script src="/js/search.js"></script>
{% endblock %}
